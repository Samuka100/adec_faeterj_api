name: adec-api
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/adec-api:latest
            ${{ secrets.DOCKER_USERNAME }}/adec-api:${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        run: |
          curl -fsS -X POST -G "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --data-urlencode "imgURL=docker.io/${{ secrets.DOCKER_USERNAME }}/adec-api:${{ github.sha }}"